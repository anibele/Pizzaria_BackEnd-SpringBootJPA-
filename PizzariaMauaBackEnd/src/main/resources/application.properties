spring.application.name=PizzariaMauaBackEnd
# Valida o schema previamente migrado, sem criar ou alterar tabelas.
spring.jpa.hibernate.ddl-auto=validate
# Banco local previamente criado e migrado.
spring.datasource.url=jdbc:mysql://localhost:3306/pizzamaua
#DB User
spring.datasource.username=${DB_USERNAME}
# Credenciais externas tambem no ambiente local; nao versionar senhas.
spring.datasource.password=${DB_PASSWORD}

#Endpoint do front-end para o back-end
IPV4=192.168.100.8
PORT=5176

#Construindo o endpoint dinamicamente aqui dentro
FRONTAPI=http://${IPV4}:${PORT}
# Chave externa: ao menos 32 bytes aleatorios em Base64, sem fallback.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:}
api.security.token.validade-equipe=${API_SECURITY_TOKEN_VALIDADE_EQUIPE:PT8H}
api.security.token.validade-mesa=${API_SECURITY_TOKEN_VALIDADE_MESA:P7D}
